version: "3.8"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16 Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dams-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dams
      POSTGRES_USER: dams_user
      POSTGRES_PASSWORD: dams_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dams_user -d dams"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────
  # Express.js Backend API
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: dams-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://dams_user:dams_password@db:5432/dams
      JWT_SECRET: dams-jwt-secret-change-in-production
      NODE_ENV: development
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # ──────────────────────────────────────────────
  # Next.js Frontend Application
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: dams-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
